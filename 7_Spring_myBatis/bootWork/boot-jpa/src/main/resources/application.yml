spring:
  application:
    name: boot-jpa

  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe
    driver-class-name: oracle.jdbc.driver.OracleDriver
    username: heejin
    password: oracle

  jpa:
    hibernate:
      ddl-auto: update  #개발 시에는 update, 운영 시에는 validate, nono 추천
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect

  sql:
    init:
      platform: oracle
      encoding: UTF-8
      mode: always

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp 
logging:
  level:
    jpa: debug

server:
  port: 8081
  shutdown: graceful
