#        dialect: org.hibernate.dialect.OracleDialect

  # 로그 출력 위치 및 파일 이름 설정
  output:
    ansi:
      enabled: always

logging:
  file:
    name: logs/sbb.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 100MB
      file-name-pattern: logs/sbb.%d{yyyy-MM-dd}-%i.log
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul