spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    driver-class-name: oracle.jdbc.OracleDriver
    username: kingsmile
    password: oracle

#  jpa:
#    hibernate:
#      ddl-auto: update
#    show-sql: true
#    properties:
