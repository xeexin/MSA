#spring.application.name=boot-board

# Oracle DB 설정
spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: heejin
    password: oracle
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update  # 개발 시에는 update, 운영 시에는 validate, nono 추천
    show-sql: true  # 콘솔 창에 SQL 쿼리 출력 
    database-platform: org.hibernate.dialect.OracleDialect

  sql:
    init:
      platform: oracle
      mode: always
      encoding: UTF-8
        

# 로깅 레벨 설정
logging:
  level:
    jpa: debug	  

server:
  port: 8081
shutdown: graceful
