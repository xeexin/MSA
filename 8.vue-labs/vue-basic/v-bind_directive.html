<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app">
     <input type="text" :value="msg"><br><br>
     <img v-bind:src="img_path">
     <child-component :mydata="message"></child-component>
     
  </div>

  <script src="https://unpkg.com/vue"></script>
  <script>
    var vm = Vue.createApp({
       name: "App",
       data() {
        return {
          msg : "Hello, v-bind",
          message: "부모가 자식에게 전달해요!",
          img_path:"https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png"
         
        }
       },
       components: {
          "child-component": {
            name:"ChildComponent",
            props:{
              mydata: String
            },
            template: "<div>전달된 데이터 : {{mydata}} </div>"
          }
       }
    }).mount("#app")
  </script>

</body>
</html>
