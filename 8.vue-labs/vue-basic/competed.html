<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
    <div id="app">
      <div>
      <!-- v-model directive는 양방향 바인딩을 지원 
           일반적으로 Vue는 단방향 데이터 바인딩만 지원
           즉, Component의 data가 변경되면 View를 변경하는 방식만 지원 -->
        1보다 큰수 : <input type="text" v-model="num"> <br>
        <!-- 1부터 입력한 값까지 합 : <span>{{num}}</span><br>
        1부터 입력한 값까지 합 : <span>{{ sum() }}</span><br>
        1부터 입력한 값까지 합 : <span>{{ sum() }}</span><br> -->
        1부터 입력한 값까지 합 : <span>{{computed_sum}}</span><br>
        1부터 입력한 값까지 합 : <span>{{ computed_sum }}</span><br>
        1부터 입력한 값까지 합 : <span>{{ computed_sum }}</span><br>
      </div>
    </div>
    
    <script src="https://unpkg.com/vue"></script>
    <script>
      var vm = Vue.createApp({
          name : "App",
          data(){
            return {
              num: 0
            }
          },
          methods : {
            sum() {
              console.log("num의 값은 "+ this.num)
              var n = parseInt(this.num)
              return (n * (n + 1)) / 2
            }
          },
          computed : {
            computed_sum() {
              console.log("num의 값은 "+ this.num)
              var n = parseInt(this.num)
              return (n * (n + 1)) / 2
            }
          }
      }).mount("#app")
    </script>
</body>
</html>
