<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- mount point -->
  <div id="app">
    Root Component가 가지는데이터 {{message}}
  </div>

  <script src="https://unpkg.com/vue"></script>
  <script>
    //사용자 정의 code
    //자바스크립트 객체 literal을 만들어요!
    var model = {
      message : "안녕하세요. Vue!!"
    }

    // Application Instance를 생성
    // Application Instance는 우리의 Vue Program을 대변하는 객체. 그래서 우리 Vue Program의 전체 설정 같은 작업을 할 수 있어요.!

    // Application Instance는Root Component Instance를 생성하기 위한 정보를 가지고 있엉야해요! 
    // 이 정보는 당연히 객체 형태로 표현되고, 이 객체를 Option 객체라고 불러요.!
    var app = Vue.createApp({
      name: "App",  //name은 컴포넌트의 논리적인 이름
      // data() 함수는 반드시 객체를 리턴해야 하고, 그 객체 안에 있는 Property가 우리 Component의 data예요.!
      data() {   
        return model;
      }
    })


    // mount한 결과는 Root Component Instance
    var vm = app.mount("#app")

  </script>
</body>
</html>
