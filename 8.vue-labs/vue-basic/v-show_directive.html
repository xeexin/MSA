<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app">
     <div>
      예금액 : <input type="text" v-model.number="amount"><br><br>
      현재 예금액 : <span v-text="amount"></span><br><br>
      조건에 따른 예금액 : <span v-show="amount > 0" v-text="amount"></span>
     </div>
  </div>

  <script src="https://unpkg.com/vue"></script>
  <script>
    var vm = Vue.createApp({
       name: "App",
       data() {
        return {
         amount : 0
         
        }
       },
     
    }).mount("#app")
  </script>

</body>
</html>
