<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX10_css.html</title>
    <style type="text/css">
      /*
        E:가상선택자 <--- 대화형컨텐츠
      E::가상요소 <--- E::before    E::after
      E:nth-child(n)  <--- E:nth-child(2) 
      E:nth-child(2n)  <--- E:nth-child(2n) 
      E:nth-of-type(n)
      E:not(s) <---  .fruits  div:not(.strawberry) 
        */
    </style>
    <link rel="stylesheet" href="../css/ex10.css" />
  </head>
  <body>
    <ul class="fruits">
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
    </ul>
    <hr />
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
    </ul>
    <img
      src="../../img/노래바라.jpg"
      alt="노래바라"
      style="width: 50%; height: 50%"
    />
    <div>
      <div class="fruits"></div>
      <div class="strawberry"></div>
      <div></div>
      <div></div>
    </div>
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
    </ul>
  </body>
</html>
